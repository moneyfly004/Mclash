name: libclash_vpn_service
description: Mclash 的 VPN 服务插件 —— Android 走进程内 libmihomo.aar（VpnService + TUN fd 注入），Windows/macOS 走 mihomo 子进程 + 系统代理。原 Clash Mi 依赖外置的 libclash-vpn-service，此处为 Mclash 自有的等价实现。
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.4
  device_info_plus: ^11.1.0
  yaml: ^3.1.2
  http: ^1.2.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: top.moneyfly.vpnservice
        pluginClass: VpnServicePlugin
      # 桌面端（windows/macos/linux）故意不在这里声明。
      # 桌面实现完全由 Dart 负责（mihomo 子进程 + 系统代理），注册走显式调用：
      # lib/main.dart 的 registerMclashVpnService()（原因见 lib/libclash_vpn_service.dart）。
      # 一旦声明 dartPluginClass，Flutter 的 dart_plugin_registrant 会生成
      # `DesktopVpnServiceImpl.registerWith()` 调用，而该类是 VpnServicePlatform 的
      # 子类、并没有该静态方法 → kernel_snapshot 编译失败，任何平台都构建不了。
