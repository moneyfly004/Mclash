group = 'top.moneyfly.vpnservice'
version = '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = 'top.moneyfly.vpnservice'
    compileSdk = 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk = 26
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    if (file('libs/libmihomo.aar').exists()) {
        implementation(name: 'libmihomo', ext: 'aar')
        implementation("androidx.core:core-ktx:1.13.1")
    } else {
        logger.warn(
                "[Mclash] 未找到 packages/libclash_vpn_service/android/libs/libmihomo.aar —— " +
                        "内置内核不可用（VpnService 无法启动）。" +
                        "请运行 tool/fetch_mihomo_aar.sh 下载。"
        )
    }
}
