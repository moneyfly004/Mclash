name: mclash
description: Mclash - MoneyFly 多平台加速客户端（Mclash 风格 + 4 Tab）

publish_to: none 
version: 0.0.1+5
environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  async: 2.13.0
  win32: 5.15.0 # windows_version_helper 直接用（原来是传递依赖）
  convert: 3.1.2
  image: 4.5.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: 1.0.9
  flutter_emoji: 2.5.1
  device_info_plus: 11.3.0
  package_info_plus: 9.0.0
  ffi: 2.2.0
  url_launcher: 6.3.2
  path_provider: 2.1.6
  flutter_secure_storage: 10.3.1
  protocol_handler: 0.1.6 #0.2.0 cause windows jam when exit
  json_annotation: 4.12.0
  re_editor: 0.10.0
  re_highlight: 0.0.3
  launch_at_startup: 0.2.2 #0.2.2 - 0.3.1 StartupApproved cause reg exceptions
  provider: 6.1.5+1
  zxing2: 0.2.4
  qr_code_scanner_plus: 2.2.0
  screen_capturer: 0.2.3
  fast_cached_network_image: 1.3.3+5
  uuid: 4.6.0 #flutter_test 
  slang: 4.19.1
  slang_flutter: 4.19.0
  watcher: 1.2.1
  punycode_converter: 0.2.1
  yaml: 3.1.4
  yaml_writer: 2.1.0
  scrollview_observer: 1.27.1
  after_layout: 1.2.0
  flutter_single_instance: 1.7.0
  flutter_plugin_android_lifecycle: 2.0.35 #file_picker image_picker
  file_picker: 11.0.3
  image_picker: 1.2.3
  tray_manager: 0.5.3
  hotkey_manager: 0.2.3
  logger: 2.8.0
  tuple: 2.0.2
  crypto: 3.0.7
  cryptography: 2.9.0
  encrypt: 5.0.3
  open_dir: 0.0.2+1
  path: 1.9.1 #flutter_test
  characters: 1.4.1 #flutter_test
  win32_registry: 1.1.5 #flutter_test
  share_plus: 12.0.2
  open_file: 4.0.0
  app_installer: 1.3.1
  app_settings: 9.0.0
  mime: 2.1.0
  http: 1.6.0
  http_parser: 4.1.2
  icloud_storage: 2.2.0 #https://github.com/lollipopkit/flutter_server_box/blob/d94b2a7805891da3e652a9a65cc0c774a2ec6db4/lib/core/utils/sync/icloud.dart#L32
  archive: 4.2.0
  flutter_js: 0.8.7
  quick_actions: 1.1.0
  #overrides
  flutter_inappwebview: ^6.1.5
  window_manager: ^0.5.0
  webdav_client_plus: 1.0.2
  android_package_manager: 0.7.1
  libclash_vpn_service: 1.0.0

dev_dependencies:
  source_gen: 4.2.3
  build_runner: 2.15.0
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  json_serializable: 6.14.0 #dart run build_runner build

dependency_overrides:
  # 注意：原 Clash Mi 把 5 个依赖 override 到 KaringX 的 git fork（含私有改动）。
  # Mclash 改为**只用 pub.dev 版本**：
  #   1) git 依赖在本机与 CI 上都频繁拉取失败（RPC failed / early EOF）；
  #   2) 官方版本可复现、可审计，升级路径清晰；
  #   3) fork 里被用到的少数专有 API（见 inapp_webview_screen.dart）已在 Mclash 内实现。
  path_provider_foundation: 2.3.2

  # Mclash 自有的 VPN 服务插件（Android: MethodChannel + libmihomo.aar；
  # Windows/macOS: mihomo 子进程 + 系统代理）
  libclash_vpn_service:
    path: packages/libclash_vpn_service
flutter:
  uses-material-design: true
  assets:
    - assets/zashboard/
    - assets/zashboard/assets/
    - assets/txts/
    - assets/fonts/
    - assets/images/
    - path: assets/datas/ASN.mmdb
      platforms: [windows, macos, android]
    # 离线分流数据（`tool/fetch_geodata.sh` 下载，CI 构建前拉取）。
    #
    # **必须随包内置，且必须声明在这里。** 内核（mihomo）以 `-d <work_dir>`
    # 启动后，会按**固定文件名** country.mmdb / geosite.dat 在 `-d` 目录里找
    # 分流数据；找不到时它**不是降级而是去 GitHub 下载**
    # （日志 `Can't find MMDB, start download`）——国内不可达 → 内核永不就绪 →
    # 上层 60s 超时，用户看到的就是「核心启动不起来 / 连不上」。
    #
    # 此前 `assets/rules/` 已被 `tool/fetch_geodata.sh` 下载到磁盘，但**没有
    # 在这里声明**，于是两个文件从未进入 flutter_assets，内核无论如何都找不到。
    - path: assets/rules/country.mmdb
      platforms: [windows, macos, android]
    - path: assets/rules/geosite.dat
      platforms: [windows, macos, android]

  fonts:
    - family: Emoji # from hiddify
      fonts:
        - asset: assets/fonts/Emoji.ttf


#https://www.appicon.co/
flutter_launcher_icons: #flutter pub run flutter_launcher_icons
  android: ic_launcher
  image_path: logo-round.png 
  min_sdk_android: 21 
  image_path_android: logo-round.png
  windows:
    generate: false 
    image_path: logo-round.png
    icon_size: 48
  macos:
    generate: true
    image_path: logo-round-macos.png
 