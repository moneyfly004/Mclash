org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
# ⚠️ 不要在此硬编码 org.gradle.java.home。
# 原 Mclash 写了 C:\Program Files\Eclipse Adoptium\jdk-17.0.20.101-hotspot，
# 导致 macOS / Linux / CI 上 Gradle 直接启动失败。
# 需要指定 JDK 时请用其一：
#   1) 环境变量 JAVA_HOME
#   2) 命令行 -Dorg.gradle.java.home=/path/to/jdk17
#   3) ~/.gradle/gradle.properties（本机私有，不入库）
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
