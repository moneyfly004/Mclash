name: Submit a Bug
title: "[BUG]"
description: Submit a bug

body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting an issue, please confirm the following:
        1. The issue title should be concise and clear. Refer to the format: [BUG][Windows] Clicking connect causes the app to crash.
        2. Please ensure that no one has submitted a similar issue in the [Existing Issues] section. Otherwise, please discuss it in an existing issue.
        3. Please describe the issue in detail according to the template specifications.
        4. For issues such as connection problems, please run 'Network Check' and copy the results into the issue.
        5. Please strictly follow the above requirements and processes, otherwise the issue will be closed directly.
  - type: dropdown
    attributes:
      label: Operating System
      description: Operating system type
      options:
        - Android
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    attributes:
      label: Operating System Version
      description: Operating system version
    validations:
      required: true
  - type: textarea
    attributes:
      label: App Version
      description: The full version number, such as 1.2.11.1405
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: Detailed description of the bug
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Please provide detailed steps to reproduce the problem (video recordings would be greatly appreciated).
  - type: textarea
    attributes:
      label: Log
      description: |-
        About - Developer Options - View File - service_core.log
      render: shell
  - type: textarea
    attributes:
      label: Network Check Results
      description: |-
        Connect first, run 'Network Check' in the app, then copy and paste the results here
      render: shell
