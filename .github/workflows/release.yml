name: Release (Android / Windows / macOS)

# 触发：
#   1) push tag（如 v1.0.0）→ 构建并发布到 GitHub Releases
#   2) workflow_dispatch 手动触发（可填版本号）
#
# 需要的仓库 Secrets（Android 正式签名；缺失时回退 debug 签名并打印警告）：
#   KEYSTORE_BASE64    release.keystore 的 base64
#   KEYSTORE_PASSWORD  keystore 密码
#   KEY_ALIAS          密钥别名
#   KEY_PASSWORD       密钥密码
#
#   keytool -genkey -v -keystore release.keystore -alias mclash \
#     -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS
#   base64 -i release.keystore | pbcopy   # 填入 KEYSTORE_BASE64
#
# 内核策略（详见 docs/design/08）：
#   · Android：moneyfly004/mihomo-lib 的预编译 libmihomo.aar
#     （官方 MetaCubeX/mihomo 源码 + gomobile bind，**无 fork**，每日自动跟随官方新版）
#   · Windows：官方 mihomo-windows-amd64-**compatible**（标准版要求 AVX2，老 CPU 启动即崩）
#   · macOS arm64：官方 mihomo-darwin-arm64
#   · macOS x64：官方 mihomo-darwin-amd64-**compatible**（Rosetta/老 Intel 跑不了标准版）
#   · macOS universal：上面两个 lipo -create 合并
# 升级内核只需改 MIHOMO_VERSION 一处。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0；留空则用 tag 或 pubspec）'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.44.4'   # 与开发机一致，保证构建可复现
  MIHOMO_VERSION: '1.19.31'   # 内核版本（唯一真源）
  PUB_HOSTED_URL: 'https://pub.flutter-io.cn'
  FLUTTER_STORAGE_BASE_URL: 'https://storage.flutter-io.cn'

jobs:
  # ================= Android：多 ABI 分版本 =================
  android:
    name: Android (arm64-v8a / armeabi-v7a / x86_64 / AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 离线分流数据（构建时下载，不入库）
        run: bash tool/fetch_geodata.sh

      # libmihomo.aar 约 180MB，从发布仓库秒级下载（不在主仓库现编）
      - name: 下载 libmihomo.aar
        run: |
          mkdir -p packages/libclash_vpn_service/android/libs
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 1800 \
            -o packages/libclash_vpn_service/android/libs/libmihomo.aar \
            "https://github.com/moneyfly004/mihomo-lib/releases/download/v$MIHOMO_VERSION/libmihomo.aar"
          ls -lh packages/libclash_vpn_service/android/libs/libmihomo.aar

      - name: 依赖
        run: flutter pub get

      - name: 静态检查与测试
        run: |
          flutter analyze --no-fatal-infos
          flutter test --concurrency=1

      # 顺序很重要：**AAB 必须在 APK 之前构建**。
      # 先跑 `build apk --split-per-abi` 会在 R8 的
      # build/app/intermediates/shrunk_resources_proto_format/release/minifyReleaseWithR8/
      # 下留下多个 shrunk-resources-proto-format-*.ap_，随后 bundleRelease 会报
      # 「Multiple shrunk-resources files found ... Please disable building multiple
      # APKs when building an Android app bundle」（AGP 已知问题 402800800），
      # 整个 Android 作业直接红。反过来先出 AAB 就没有这个问题。
      - name: 构建 AAB（应用商店备用）
        run: |
          # 双保险：即使有缓存残留也先清掉那个目录
          rm -rf build/app/intermediates/shrunk_resources_proto_format || true
          flutter build appbundle --release --split-debug-info=build/symbols --obfuscate
        env:
          # 关掉 Gradle 的 ABI splits：否则 bundleRelease 会因为目录里有多份
          # shrunk-resources 而失败（AGP 402800800）。Gradle 会把
          # ORG_GRADLE_PROJECT_xxx 自动映射成项目属性 xxx，见 build.gradle.kts。
          ORG_GRADLE_PROJECT_disableAbiSplits: "true"
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 构建多 ABI APK（obfuscate + 保留符号，省约 10% 体积）
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols --obfuscate
        env:
          # 必须在此注入，否则 Gradle 读不到 → 每次构建用临时 debug 签名 →
          # 版本间签名不一致 → 用户无法覆盖升级、必须卸载重装
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 重命名产物
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          V="${V#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Mclash-android-armeabi-v7a-$V.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  dist/Mclash-android-arm64-v8a-$V.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk     dist/Mclash-android-x86_64-$V.apk
          cp build/app/outputs/bundle/release/app-release.aab         dist/Mclash-android-$V.aab
          cd dist && sha256sum * > SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mclash-android
          path: dist/

  # ================= Windows：exe 安装包 + zip 便携版 =================
  windows:
    name: Windows (exe 安装包 + zip 便携版)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 离线分流数据
        shell: bash
        run: bash tool/fetch_geodata.sh

      - name: 下载 mihomo 内核（官方预编译，**compatible** 版）
        shell: bash
        env:
          MIHOMO_VERSION: ${{ env.MIHOMO_VERSION }}
        run: |
          # 走工具脚本而不是内联 curl：脚本里有 zip 完整性 + PE 架构校验
          # （内联版本只解压不校验，错误架构的产物会潜伏到用户机器才闪退）。
          bash tool/fetch_mihomo.sh --target windows "$MIHOMO_VERSION"
          # 再补一次「在 Windows 上真的能跑起来」的验证 —— 这是 CI 独有的优势，
          # 交叉编译环境做不了，所以脚本里没有。
          ./build/mihomo/mihomo.exe -v | head -1

      - name: 静态检查与测试（含真实内核 e2e）
        shell: bash
        run: |
          export MCLASH_MIHOMO="$PWD/build/mihomo/mihomo.exe"
          flutter analyze --no-fatal-infos
          flutter test --concurrency=1

      - name: 构建 Windows release
        run: flutter build windows --release

      - name: 内置 mihomo 内核（与 Mclash.exe 同目录）
        shell: bash
        run: |
          RELEASE_DIR="build/windows/x64/runner/Release"
          cp build/mihomo/mihomo.exe "$RELEASE_DIR/mihomo.exe"
          ls -la "$RELEASE_DIR/mihomo.exe"

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 补齐 Inno Setup 语言包
        shell: bash
        run: |
          # inno_setup.iss 的 [Languages] 里有简体中文等**非官方**语言包，
          # 官方 Inno Setup 安装包里没有它们，ISCC 会直接
          # 「Couldn't open include file ...\Languages\ChineseSimplified.isl」。
          # 这里按模板里实际引用的清单，把缺的从 jrsoftware/issrc 的
          # Unofficial 目录补齐（有官方版就用官方版）。
          python3 - <<'PYEOF'
          import os, pathlib, re, sys, urllib.request, urllib.error

          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          iss = pathlib.Path("windows/packaging/exe/inno_setup.iss").read_text(
              encoding="utf-8"
          )
          names = sorted(set(re.findall(r"compiler:Languages\\([A-Za-z0-9_]+)\.isl", iss)))
          lang_dir = pathlib.Path(
              os.environ.get("ProgramFiles(x86)", r"C:\Program Files (x86)")
          ) / "Inno Setup 6" / "Languages"
          print("模板引用语言数:", len(names), "语言目录:", lang_dir)

          base = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages"
          missing = []
          for name in names:
              dest = lang_dir / f"{name}.isl"
              if dest.exists():
                  continue
              # 优先官方目录（issrc 里其实全都有），Unofficial 作为兜底
              for sub in ("", "Unofficial/"):
                  url = f"{base}/{sub}{name}.isl"
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          data = r.read()
                      dest.write_bytes(data)
                      print("downloaded:", name, "from", sub or "official")
                      break
                  except urllib.error.HTTPError:
                      continue
                  except Exception as e:  # noqa: BLE001
                      print("retry needed:", name, e)
                      continue
              else:
                  missing.append(name)

          if missing:
              raise SystemExit("missing language packs: %s" % missing)
          print("all language packs present")
          PYEOF

      - name: 打包（zip 便携版 + exe 安装版）
        shell: bash
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          V="${V#v}"
          RELEASE_DIR="build/windows/x64/runner/Release"
          mkdir -p dist
          WIN_RELEASE_DIR=$(cygpath -w "$(pwd)/$RELEASE_DIR")
          WIN_DIST=$(cygpath -w "$(pwd)/dist")
          powershell -Command "Compress-Archive -Path '$WIN_RELEASE_DIR\*' -DestinationPath '$WIN_DIST\Mclash-windows-x64-portable-$V.zip' -Force"
          # inno_setup.iss 是 flutter_distributor 的模板，里面是 {{占位符}}。
          #
          # 不要用 `/DNAME=value` 传：Git-Bash(MSYS) 会改写以 / 开头的参数，
          # 值里带 `https://` 时更是直接被判成 "Unknown option"。所以这里像
          # flutter_distributor 一样**先把模板替换成真实值**再交给 ISCC：
          # 参数里不再有任何斜杠，跨 shell 都不会被篡改。
          WIN_DIST_W=$(cygpath -w "$(pwd)/dist")
          ICON_W=$(cygpath -w "$(pwd)/windows/runner/resources/app_icon.ico")
          ISSPP_SOURCE_DIR="$WIN_RELEASE_DIR" \
          ISSPP_DIST="$WIN_DIST_W" \
          ISSPP_ICON="$ICON_W" \
          ISSPP_VERSION="$V" \
          python3 - <<'PYEOF'
          import os, pathlib, sys

          # Windows runner 的控制台是 cp1252：不重配就打印非 ASCII 会直接
          # UnicodeEncodeError（这个坑在 fetch_*.sh 里已经踩过一次）。
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          sys.stderr.reconfigure(encoding="utf-8", errors="replace")

          tpl = pathlib.Path("windows/packaging/exe/inno_setup.iss").read_text(
              encoding="utf-8"
          )
          values = {
              "APP_ID": "74F1C307-2E21-4951-BB25-763C3A2AE9EF",
              "APP_VERSION": os.environ["ISSPP_VERSION"],
              "DISPLAY_NAME": "Mclash",
              "PUBLISHER_NAME": "MoneyFly",
              "PUBLISHER_URL": "https://new.moneyfly.top",
              "EXECUTABLE_NAME": "mclash.exe",
              "OUTPUT_BASE_FILENAME": f"Mclash-setup-{os.environ['ISSPP_VERSION']}",
              "SETUP_ICON_FILE": os.environ["ISSPP_ICON"],
              "SOURCE_DIR": os.environ["ISSPP_SOURCE_DIR"],
              "BUILD_DIR": os.environ["ISSPP_SOURCE_DIR"],
          }
          for key, val in values.items():
              tpl = tpl.replace("{{%s}}" % key, val)
          # 产物统一落到 dist/（发布作业按 dist/** 收集）
          tpl = tpl.replace("OutputDir=.", "OutputDir=%s" % os.environ["ISSPP_DIST"])
          left = [l for l in tpl.splitlines() if "{{" in l]
          if left:
              raise SystemExit("unresolved placeholders in iss template: %s" % left)
          out = pathlib.Path("build/inno_run.iss")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(tpl, encoding="utf-8")
          print("generated:", out)
          PYEOF
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "$(cygpath -w "$(pwd)/build/inno_run.iss")"
          cd dist && sha256sum * > SHA256SUMS-windows.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: mclash-windows
          path: dist/

  # ================= macOS arm64（Apple 芯片）=================
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 离线分流数据
        run: |
          bash tool/fetch_geodata.sh

      - name: 下载 mihomo 内核（arm64）
        run: |
          mkdir -p build/mihomo
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 600 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && mv mihomo build/mihomo/mihomo && chmod +x build/mihomo/mihomo
          ./build/mihomo/mihomo -v | head -1

      - name: 静态检查与测试（含真实内核 e2e）
        run: |
          export MCLASH_MIHOMO="$PWD/build/mihomo/mihomo"
          flutter analyze --no-fatal-infos
          flutter test --concurrency=1

      - name: 构建 macOS（arm64）
        run: flutter build macos --release

      - name: 内置 mihomo 内核（arm64）
        run: |
          APP="build/macos/Build/Products/Release/Mclash.app"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 600 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && cp mihomo "$APP/Contents/MacOS/mihomo" && chmod +x "$APP/Contents/MacOS/mihomo"
          lipo "$APP/Contents/MacOS/mihomo" -verify_arch arm64

      # Flutter 的 macOS release **默认产出 universal**。若不裁剪就直接标成
      # "arm64" 发布，包里会同时带着 x86_64 主程序 —— 而内嵌内核是 arm64-only，
      # Intel 用户装上后表现为"能开但连不上"。所以必须把 app 与内核一起裁成 arm64。
      - name: 裁剪为纯 arm64 并校验
        run: |
          bash scripts/thin_app.sh arm64 build/macos/Build/Products/Release/Mclash.app
          APP="build/macos/Build/Products/Release/Mclash.app"
          [ "$(lipo -archs "$APP/Contents/MacOS/Mclash")" = "arm64" ] || { echo "主程序不是纯 arm64"; exit 1; }
          [ "$(lipo -archs "$APP/Contents/MacOS/mihomo")" = "arm64" ] || { echo "内核不是纯 arm64"; exit 1; }

      - name: 打包 arm64 DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/Mclash.app"; mkdir -p dist
          STAGE="build/dmg-stage-arm64"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/Mclash.app"; ln -s /Applications "$STAGE/Applications"
          [ -f scripts/uninstall_macos.command ] && cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command" || true
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/Mclash.app" || true
          hdiutil create -volname Mclash -srcfolder "$STAGE" -ov -format UDZO "dist/Mclash-macos-arm64-$V.dmg"
          cd dist && shasum -a 256 Mclash-macos-arm64-$V.dmg > SHA256SUMS-macos-arm64.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: mclash-macos-arm64
          path: |
            dist/Mclash-macos-arm64-*.dmg
            dist/SHA256SUMS-macos-arm64.txt

  # ================= macOS x64（Intel，Rosetta 整链）=================
  # 说明：GitHub 公共 Intel runner(macos-13) 队列极长，故 x64 在 Apple Silicon
  # runner 上用 Rosetta 执行整条 x86_64 构建链（arch -x86_64 flutter build），
  # 产物为纯 x86_64，快照/引擎自洽（不做 universal→thin 裁剪）。
  macos-x64:
    name: macOS x64 (Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Rosetta 2
        run: |
          if ! arch -x86_64 true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: 依赖
        run: flutter pub get

      - name: 离线分流数据
        run: |
          bash tool/fetch_geodata.sh

      - name: 下载 mihomo 内核（**compatible**，x64）
        run: |
          mkdir -p build/mihomo
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 600 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-amd64-compatible-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && mv mihomo build/mihomo/mihomo && chmod +x build/mihomo/mihomo
          ./build/mihomo/mihomo -v | head -1

      - name: 静态检查与测试（含真实内核 e2e）
        run: |
          export MCLASH_MIHOMO="$PWD/build/mihomo/mihomo"
          flutter analyze --no-fatal-infos
          flutter test --concurrency=1

      - name: 构建 macOS（x64，Rosetta 整链）
        run: arch -x86_64 flutter build macos --release

      - name: 内置 mihomo 内核（**compatible**，必须）
        run: |
          APP="build/macos/Build/Products/Release/Mclash.app"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 600 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-amd64-compatible-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && cp mihomo "$APP/Contents/MacOS/mihomo" && chmod +x "$APP/Contents/MacOS/mihomo"
          lipo "$APP/Contents/MacOS/mihomo" -verify_arch x86_64

      # Rosetta 整链本应只产 x86_64，但仍显式裁剪一次并断言：
      # 若某天 Flutter 改成在 Rosetta 下也产 universal，这里会立刻失败而不是
      # 静默发出一个"标着 Intel、实际带 arm64"的包。
      - name: 裁剪为纯 x86_64 并校验
        run: |
          bash scripts/thin_app.sh x86_64 build/macos/Build/Products/Release/Mclash.app
          APP="build/macos/Build/Products/Release/Mclash.app"
          [ "$(lipo -archs "$APP/Contents/MacOS/Mclash")" = "x86_64" ] || { echo "主程序不是纯 x86_64"; exit 1; }
          [ "$(lipo -archs "$APP/Contents/MacOS/mihomo")" = "x86_64" ] || { echo "内核不是纯 x86_64"; exit 1; }

      - name: 打包 x64 DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/Mclash.app"; mkdir -p dist
          STAGE="build/dmg-stage-x64"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/Mclash.app"; ln -s /Applications "$STAGE/Applications"
          [ -f scripts/uninstall_macos.command ] && cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command" || true
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/Mclash.app" || true
          hdiutil create -volname Mclash -srcfolder "$STAGE" -ov -format UDZO "dist/Mclash-macos-x64-$V.dmg"
          cd dist && shasum -a 256 Mclash-macos-x64-$V.dmg > SHA256SUMS-macos-x64.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: mclash-macos-x64
          path: |
            dist/Mclash-macos-x64-*.dmg
            dist/SHA256SUMS-macos-x64.txt

  # ================= macOS universal =================
  macos-universal:
    name: macOS universal（arm64 + x86_64）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 离线分流数据
        run: |
          bash tool/fetch_geodata.sh

      - name: 下载 mihomo 内核（测试用 arm64）
        run: |
          mkdir -p build/mihomo
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 600 -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo.gz && mv mihomo build/mihomo/mihomo && chmod +x build/mihomo/mihomo

      - name: 静态检查与测试（含真实内核 e2e）
        run: |
          export MCLASH_MIHOMO="$PWD/build/mihomo/mihomo"
          flutter analyze --no-fatal-infos
          flutter test --concurrency=1

      - name: 构建 macOS release（Flutter 直出 universal）
        run: flutter build macos --release

      - name: 校验双架构（主程序必须同时含 arm64 与 x86_64）
        run: |
          lipo build/macos/Build/Products/Release/Mclash.app/Contents/MacOS/Mclash -verify_arch arm64 x86_64
          archs="$(lipo -archs build/macos/Build/Products/Release/Mclash.app/Contents/MacOS/Mclash)"
          echo "$archs" | grep -qw arm64   || { echo "缺 arm64"; exit 1; }
          echo "$archs" | grep -qw x86_64  || { echo "缺 x86_64"; exit 1; }

      - name: 内置 mihomo 内核（universal：arm64 + amd64-compatible）
        run: |
          APP="build/macos/Build/Products/Release/Mclash.app"
          mkdir -p sb && cd sb
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 600 -o mihomo-arm64.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-arm64-v$MIHOMO_VERSION.gz"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 600 -o mihomo-x64.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v$MIHOMO_VERSION/mihomo-darwin-amd64-compatible-v$MIHOMO_VERSION.gz"
          gunzip -f mihomo-arm64.gz mihomo-x64.gz
          lipo -create mihomo-arm64 mihomo-x64 -output mihomo
          chmod +x mihomo
          cd ..
          cp sb/mihomo "$APP/Contents/MacOS/mihomo"
          chmod +x "$APP/Contents/MacOS/mihomo"
          lipo "$APP/Contents/MacOS/mihomo" -verify_arch arm64 x86_64

      - name: 打包 universal DMG
        run: |
          V="${INPUT_VERSION:-$GITHUB_REF_NAME}"; V="${V#v}"
          APP="build/macos/Build/Products/Release/Mclash.app"; mkdir -p dist
          STAGE="build/dmg-stage-universal"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/Mclash.app"; ln -s /Applications "$STAGE/Applications"
          [ -f scripts/uninstall_macos.command ] && cp scripts/uninstall_macos.command "$STAGE/uninstall.command" && chmod +x "$STAGE/uninstall.command" || true
          codesign --force --deep -s - --entitlements macos/Runner/Release.entitlements "$STAGE/Mclash.app" || true
          hdiutil create -volname Mclash -srcfolder "$STAGE" -ov -format UDZO "dist/Mclash-macos-universal-$V.dmg"
          cd dist && shasum -a 256 Mclash-macos-universal-$V.dmg > SHA256SUMS-macos-universal.txt
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: mclash-macos-universal
          path: |
            dist/Mclash-macos-universal-*.dmg
            dist/SHA256SUMS-macos-universal.txt

  # ================= 发布 =================
  release:
    name: 发布到 GitHub Releases
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, macos-arm64, macos-x64, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          # 必须为 true：App 的更新检查读 /releases/latest，
          # 若被同仓库里更晚发布但内容更旧的 release 占着，用户会更新到缺修复的包
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            # Mclash ${{ github.ref_name }}

            ## Packages and system requirements
            - **Android**: `Mclash-android-{arm64-v8a|armeabi-v7a|x86_64}.apk` + `.aab` (Android 8.0+)
            - **Windows**: `Mclash-setup-*.exe` installer + `Mclash-windows-x64-portable-*.zip` (Windows 10+)
            - **macOS arm64** (Apple silicon): `Mclash-macos-arm64-*.dmg` — requires **macOS 11+**
            - **macOS x64** (Intel): `Mclash-macos-x64-*.dmg` — requires **macOS 10.15+** (11+ recommended)
            - **macOS universal**: `Mclash-macos-universal-*.dmg` (runs on both chip families)

            **Do not mix architectures.** Every package is built natively and bundles a kernel
            matching its architecture. The Intel build ships the `compatible` kernel because the
            standard build requires AVX2 (older machines crash on launch).

            ## Kernel
            Official [MetaCubeX/mihomo](https://github.com/MetaCubeX/mihomo) v${{ env.MIHOMO_VERSION }}
            (Android: prebuilt through [moneyfly004/mihomo-lib](https://github.com/moneyfly004/mihomo-lib)
            with gomobile bind — no fork).

            ## Verify
              shasum -a 256 -c SHA256SUMS-*.txt
