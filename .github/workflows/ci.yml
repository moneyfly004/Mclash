name: CI

# PR / push 门禁：静态检查 + 测试。
# 不做平台构建（那是 release.yml 的事），但会跑 flutter analyze，
# 它同时校验 packages/ 下两个自有插件（path 依赖，analyze 会一并分析）。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'
  PUB_HOSTED_URL: 'https://pub.flutter-io.cn'
  FLUTTER_STORAGE_BASE_URL: 'https://storage.flutter-io.cn'

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 拉取离线分流数据
        # pubspec 声明了 assets/rules/{country.mmdb,geosite.dat}（内核启动必需），
        # 但它们体积大、不入库（见 .gitignore）。干净检出里缺这两个文件时
        # `flutter analyze` 会报 asset_does_not_exist —— 而警告在 Flutter 里是
        # **致命**的，CI 会因此红。发布流程（release.yml）本来就会拉，这里补上，
        # 保持门禁严格而不是靠 --no-fatal-warnings 放水。
        run: bash tool/fetch_geodata.sh

      - name: 生成本地化（slang）
        run: dart run slang

      - name: 静态检查
        # 门禁：0 error / 0 warning（两者都是致命的）。
        # Flutter 3.44 的 `flutter analyze` 默认连 info 一起算失败，而仓库里
        # 存在一批与本次改动无关的历史 info（depend_on_referenced_packages、
        # 上游插件的 deprecated 成员等）。放行 info、保留 error/warning 致命，
        # 才能让门禁真正反映「能不能合并」。
        run: flutter analyze --no-fatal-infos

      - name: 测试
        run: flutter test --concurrency=1

      - name: 仓库卫生检查
        # 防止把密钥/内核二进制误提交（这些已 gitignore，这里是第二道闸）
        run: |
          set -e
          fail=0
          for pat in '*.keystore' '*.jks' '*.p12' '*.aar' 'key.properties'; do
            hits=$(git ls-files -- "$pat" | head -5)
            if [ -n "$hits" ]; then
              echo "::error::不应入库的文件被跟踪: $pat"
              echo "$hits"
              fail=1
            fi
          done
          # 必需源码不能被 gitignore 误伤（历史上踩过：/lib/app/private 被忽略）
          for f in lib/app/private/app_url_utils_private.dart lib/i18n/strings.g.dart; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::必需源码未被跟踪（可能被 .gitignore 误伤）: $f"
              fail=1
            fi
          done
          exit $fail
